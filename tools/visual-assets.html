<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Enterprise Visual Asset Renderer</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --soft: #f6f8fb;
        --soft-green: #effbf6;
        --soft-blue: #f1f7ff;
        --soft-purple: #f7f4ff;
        --text: #14171f;
        --muted: #5f6878;
        --line: #dfe5ee;
        --green: #00875f;
        --green-2: #10a37f;
        --blue: #1a73e8;
        --purple: #7257d9;
        --shadow: 0 22px 58px rgba(20, 23, 31, 0.08);
        font-family: Inter, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }
      html,
      body {
        width: 1600px;
        height: 900px;
        margin: 0;
        overflow: hidden;
        color: var(--text);
        background: var(--bg);
        letter-spacing: 0;
      }
      body {
        display: grid;
        place-items: center;
      }
      .board {
        position: relative;
        width: 1600px;
        height: 900px;
        padding: 58px 64px;
        overflow: hidden;
        background:
          radial-gradient(circle at 82% 12%, rgba(26, 115, 232, 0.08), transparent 34%),
          radial-gradient(circle at 12% 88%, rgba(16, 163, 127, 0.08), transparent 32%),
          #ffffff;
      }
      .board::before {
        position: absolute;
        inset: 28px;
        content: "";
        border: 1px solid rgba(223, 229, 238, 0.78);
        border-radius: 18px;
        pointer-events: none;
      }
      .topline {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 36px;
        margin-bottom: 28px;
      }
      .titleblock {
        max-width: 1040px;
      }
      .label {
        margin-bottom: 12px;
        color: var(--green);
        font-size: 21px;
        font-weight: 900;
      }
      h1 {
        margin: 0;
        color: var(--text);
        font-size: 58px;
        line-height: 1.08;
        letter-spacing: 0;
      }
      .subtitle {
        max-width: 760px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 24px;
        line-height: 1.55;
      }
      .stamp {
        min-width: 260px;
        padding: 18px 22px;
        color: var(--green);
        font-size: 17px;
        font-weight: 900;
        text-align: right;
        border: 1px solid #b8e4d3;
        border-radius: 12px;
        background: rgba(239, 251, 246, 0.9);
      }
      .content {
        position: relative;
        z-index: 1;
      }
      .grid {
        display: grid;
        gap: 18px;
      }
      .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .card {
        min-width: 0;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 34px rgba(20, 23, 31, 0.05);
      }
      .card.green {
        border-color: #b8e4d3;
        background: linear-gradient(180deg, rgba(239, 251, 246, 0.95), #ffffff);
      }
      .card.blue {
        border-color: #bfd8ff;
        background: linear-gradient(180deg, rgba(241, 247, 255, 0.95), #ffffff);
      }
      .card.purple {
        border-color: #d8cffb;
        background: linear-gradient(180deg, rgba(247, 244, 255, 0.95), #ffffff);
      }
      .kicker {
        display: inline-flex;
        min-height: 30px;
        align-items: center;
        margin-bottom: 14px;
        padding: 0 11px;
        color: var(--green);
        font-size: 15px;
        font-weight: 900;
        border-radius: 999px;
        background: var(--soft-green);
      }
      .card.blue .kicker { color: var(--blue); background: var(--soft-blue); }
      .card.purple .kicker { color: var(--purple); background: var(--soft-purple); }
      h2 {
        margin: 0 0 12px;
        font-size: 30px;
        line-height: 1.18;
      }
      h3 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.22;
      }
      p,
      li {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.52;
        word-break: keep-all;
      }
      ul {
        display: grid;
        gap: 9px;
        margin: 14px 0 0;
        padding-left: 20px;
      }
      .metric {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        color: var(--green);
        font-size: 18px;
        font-weight: 900;
      }
      .dot {
        display: inline-flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 16px;
        font-weight: 900;
        border-radius: 50%;
        background: var(--green);
      }
      .dot.blue { background: var(--blue); }
      .dot.purple { background: var(--purple); }
      .band {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 20px;
        padding: 20px 24px;
        border: 1px solid #b8e4d3;
        border-radius: 14px;
        background: var(--soft-green);
      }
      .band strong {
        color: var(--green);
        font-size: 23px;
      }
      .flow {
        display: grid;
        grid-template-columns: repeat(var(--flow-count, 5), minmax(0, 1fr));
        gap: 12px;
        align-items: stretch;
      }
      .flow .step {
        position: relative;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #ffffff;
      }
      .flow .step:not(:last-child)::after {
        position: absolute;
        top: 50%;
        right: -14px;
        z-index: 2;
        width: 26px;
        height: 26px;
        content: "→";
        color: var(--green);
        font-size: 24px;
        font-weight: 900;
        text-align: center;
        transform: translateY(-50%);
      }
      .matrix {
        display: grid;
        grid-template-columns: 230px repeat(3, minmax(0, 1fr));
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #ffffff;
      }
      .matrix div {
        min-height: 82px;
        padding: 17px 18px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .matrix div:nth-child(4n) { border-right: 0; }
      .matrix .head {
        color: var(--green);
        font-size: 20px;
        font-weight: 900;
        background: var(--soft-green);
      }
      .matrix strong {
        display: block;
        margin-bottom: 6px;
        color: var(--text);
        font-size: 19px;
      }
      .matrix span {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.45;
      }
      .split {
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
        gap: 22px;
      }
      .mini-list {
        display: grid;
        gap: 12px;
      }
      .mini-row {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
      }
      .mini-row b {
        display: block;
        margin-bottom: 4px;
        font-size: 18px;
      }
      .mini-row span {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }
      .timeline {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }
      .timeline .card {
        min-height: 390px;
      }
      .timeline .day {
        display: inline-flex;
        margin-bottom: 18px;
        padding: 7px 12px;
        color: var(--green);
        font-size: 16px;
        font-weight: 900;
        border: 1px solid #b8e4d3;
        border-radius: 999px;
        background: #ffffff;
      }
      .caption {
        margin-top: 18px;
        color: var(--muted);
        font-size: 17px;
      }
      .mock {
        display: grid;
        gap: 12px;
        min-height: 220px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff, #f8fafc);
      }
      .mock-line {
        height: 16px;
        border-radius: 999px;
        background: #dfe7f0;
      }
      .mock-line.short { width: 62%; }
      .mock-line.mid { width: 78%; }
      .mock-chip {
        display: inline-flex;
        width: fit-content;
        padding: 7px 10px;
        color: var(--green);
        font-weight: 900;
        border-radius: 999px;
        background: var(--soft-green);
      }
    </style>
  </head>
  <body>
    <main id="board" class="board"></main>

    <script>
      const assets = {
        "guide-overview-white": {
          kind: "overview",
          label: "ChatGPT Enterprise 사용자 가이드",
          title: "업무 목적에 맞는 AI 사용 지도",
          subtitle: "개인 구독과 Enterprise의 차이를 이해하고, 회사 워크스페이스 안에서 반복 업무를 안전하게 처리합니다.",
          stamp: "본문 전용 이미지 · 화이트 테마",
        },
        "guide-chat-white": {
          kind: "chat",
          label: "Chat 기능",
          title: "맥락을 주고 답변을 검토하는 대화 흐름",
          subtitle: "파일을 올리지 않아도 목표, 배경, 발췌문, 제약, 출력 형식을 텍스트로 제공하면 실무 초안을 만들 수 있습니다.",
          stamp: "Chat · 본문 다이어그램",
        },
        "guide-image-generation-white": {
          kind: "image",
          label: "Image Generation 기능",
          title: "프롬프트만으로 업무용 이미지 만들기",
          subtitle: "목적, 독자, 비율, 스타일, 포함할 텍스트, 금지 요소를 명확히 적고 결과를 보며 작게 수정합니다.",
          stamp: "Image Generation · 본문 다이어그램",
        },
        "guide-projects-white": {
          kind: "projects",
          label: "Projects 기능",
          title: "반복 업무의 맥락을 프로젝트로 유지",
          subtitle: "프로젝트 지시문, 맥락 메모, 대화 묶음, 출력 템플릿, 결정 기록으로 팀의 작업 기준을 일관되게 관리합니다.",
          stamp: "Projects · 본문 다이어그램",
        },
        "guide-deep-research-white": {
          kind: "research",
          label: "Deep Research 기능",
          title: "질문 범위와 출처 조건으로 조사 맡기기",
          subtitle: "공개 웹과 제공된 텍스트 맥락을 기반으로 출처, 근거, 한계가 포함된 리서치 보고서를 만듭니다.",
          stamp: "Deep Research · 본문 다이어그램",
        },
        "hero-enterprise": {
          kind: "enterprise",
          label: "Enterprise 도입 개요",
          title: "개인 생산성에서 회사 업무 환경으로",
          subtitle: "Enterprise는 조직 보안, 사용자 관리, 공유 지식, 업무 표준화를 전제로 하는 회사용 AI 워크스페이스입니다.",
          stamp: "복원 이미지 · 화이트 테마",
        },
        "personal-vs-enterprise": {
          kind: "matrix",
          label: "개인 구독 vs Enterprise",
          title: "차이는 기능보다 운영 경계에서 생긴다",
          subtitle: "같은 ChatGPT 기능을 쓰더라도 소유, 데이터 보호, 협업, 관리 방식은 개인 구독과 Enterprise가 다릅니다.",
          stamp: "비교표 · 본문 이미지",
        },
        "operating-model": {
          kind: "operating",
          label: "운영 모델",
          title: "사용자, 챔피언, 관리자, 정책이 함께 움직인다",
          subtitle: "일반 사용자는 정책을 지키며 업무에 적용하고, 챔피언은 좋은 사용법을 템플릿으로 확산합니다.",
          stamp: "운영 루프 · 본문 이미지",
        },
        "department-scenarios": {
          kind: "scenarios",
          label: "활용 시나리오",
          title: "부서별 첫 업무는 작고 검토 가능한 것부터",
          subtitle: "회의록, 제안서, 리서치, 정책 초안처럼 결과를 사람이 바로 확인할 수 있는 업무가 좋은 출발점입니다.",
          stamp: "시나리오 · 본문 이미지",
        },
        "roadmap-30days": {
          kind: "timeline",
          label: "상시 적용 루틴",
          title: "시간 제한 없이 익숙한 업무부터 계속 쌓기",
          subtitle: "접속, 첫 업무, 팀 템플릿, 검토 기준, 재사용 루프를 필요할 때마다 반복합니다.",
          stamp: "상시 루틴 · 본문 이미지",
        },
        "user-codex-workflow": {
          kind: "codex",
          label: "Codex 사용자 워크플로",
          title: "목표를 주고, 작업을 맡기고, 검증한다",
          subtitle: "개발자는 저장소, 수정 범위, 검증 명령, 완료 조건을 명확히 주고 결과를 직접 확인합니다.",
          stamp: "Codex · 본문 이미지",
        },
      };

      const featureCards = [
        ["Chat", "요약, 작성, 비교, 검토를 대화로 처리", "green"],
        ["Image Generation", "프롬프트로 보고서와 발표용 이미지 제작", "blue"],
        ["Projects", "반복 업무의 지시문과 맥락 유지", "green"],
        ["Deep Research", "출처 기반 조사와 보고서 초안 작성", "purple"],
      ];

      function shell(data, inner) {
        return `
          <section class="topline">
            <div class="titleblock">
              <div class="label">${data.label}</div>
              <h1>${data.title}</h1>
              <p class="subtitle">${data.subtitle}</p>
            </div>
            <div class="stamp">${data.stamp}</div>
          </section>
          <section class="content">${inner}</section>
        `;
      }

      function renderOverview(data) {
        const cards = featureCards.map(([title, body, tone], index) => `
          <article class="card ${tone}">
            <span class="kicker">0${index + 1}</span>
            <h3>${title}</h3>
            <p>${body}</p>
          </article>
        `).join("");
        return shell(data, `
          <div class="split">
            <div class="card green">
              <h2>Enterprise 사용 원칙</h2>
              <div class="mini-list">
                ${[
                  ["1", "회사 워크스페이스에서 시작", "개인 계정이 아니라 조직이 제공한 환경에서 업무를 진행합니다."],
                  ["2", "필요한 맥락만 텍스트로 제공", "목적, 배경, 발췌문, URL, 검토 기준을 구조화합니다."],
                  ["3", "결과는 사람이 검토", "사실, 수치, 고객명, 정책 표현을 최종 확인합니다."],
                ].map(([n, t, b]) => `<div class="mini-row"><span class="dot">${n}</span><div><b>${t}</b><span>${b}</span></div></div>`).join("")}
              </div>
            </div>
            <div class="grid cols-2">${cards}</div>
          </div>
          <div class="band">
            <strong>입력 구조</strong>
            <p>목표 → 배경 → 사용할 수 있는 자료 → 제약 → 원하는 출력 → 검토 기준</p>
          </div>
        `);
      }

      function renderChat(data) {
        return shell(data, `
          <div class="flow" style="--flow-count: 6">
            ${[
              ["목표", "무엇을 완성해야 하는지 한 문장으로 정의"],
              ["배경", "대상 독자, 상황, 목적, 현재 상태 설명"],
              ["발췌문", "원문 전체 대신 필요한 문단과 표 일부 제공"],
              ["제약", "톤, 분량, 금지 표현, 정책 기준 명시"],
              ["출력", "표, 메일, 보고서, 체크리스트 형태 지정"],
              ["검토", "사실, 수치, 민감정보, 실행 가능성 확인"],
            ].map(([t, b], i) => `<article class="step"><span class="dot ${i === 4 ? "blue" : ""}">${i + 1}</span><h3>${t}</h3><p>${b}</p></article>`).join("")}
          </div>
          <div class="grid cols-3" style="margin-top: 22px">
            <article class="card green"><h3>좋은 질문</h3><ul><li>구체적인 목적</li><li>충분한 맥락</li><li>명확한 출력 형식</li></ul></article>
            <article class="card blue"><h3>후속 질문</h3><ul><li>다른 관점 요청</li><li>빠진 정보 확인</li><li>형식 변경 요청</li></ul></article>
            <article class="card"><h3>검토 체크</h3><ul><li>정확성</li><li>정책 적합성</li><li>추가 확인 사항</li></ul></article>
          </div>
        `);
      }

      function renderImage(data) {
        return shell(data, `
          <div class="grid cols-5">
            ${[
              ["목적", "어디에 쓸 이미지인가"],
              ["독자", "누가 보고 이해해야 하는가"],
              ["비율", "16:9, 4:3, 1:1 등"],
              ["스타일", "화이트 문서풍, UI 캡처풍 등"],
              ["금지 요소", "로고, 고객명, 작은 글자 제외"],
            ].map(([t, b], i) => `<article class="card ${i === 3 ? "blue" : "green"}"><span class="dot ${i === 3 ? "blue" : ""}">${i + 1}</span><h3>${t}</h3><p>${b}</p></article>`).join("")}
          </div>
          <div class="split" style="margin-top: 22px">
            <article class="card">
              <h2>프롬프트 개선 예시</h2>
              <div class="mini-list">
                <div class="mini-row"><span class="dot">전</span><div><b>분기 성과 차트 만들어줘</b><span>목적과 스타일이 없어 일반적인 결과가 나올 수 있습니다.</span></div></div>
                <div class="mini-row"><span class="dot blue">후</span><div><b>임원 보고용 16:9 화이트 테마 성과 요약 이미지</b><span>목적, 독자, 비율, 색상, 포함할 텍스트를 명확히 지정합니다.</span></div></div>
              </div>
            </article>
            <article class="card blue">
              <h2>생성 결과 사용처</h2>
              <div class="grid cols-2">
                <div class="mock"><span class="mock-chip">보고서 커버</span><span class="mock-line"></span><span class="mock-line mid"></span></div>
                <div class="mock"><span class="mock-chip">프로세스 도식</span><span class="mock-line"></span><span class="mock-line short"></span></div>
              </div>
            </article>
          </div>
        `);
      }

      function renderProjects(data) {
        return shell(data, `
          <div class="grid cols-5">
            ${[
              ["프로젝트 지시문", "역할, 톤, 산출물 기준"],
              ["맥락 메모", "배경, 최근 결정, 참고 URL"],
              ["대화 묶음", "업무별 질문과 결과"],
              ["출력 템플릿", "반복 결과 형식"],
              ["결정 기록", "확정, 보류, 다음 액션"],
            ].map(([t, b], i) => `<article class="card ${i === 3 ? "blue" : i === 2 ? "purple" : "green"}"><span class="dot ${i === 3 ? "blue" : i === 2 ? "purple" : ""}">${i + 1}</span><h3>${t}</h3><p>${b}</p></article>`).join("")}
          </div>
          <div class="flow" style="--flow-count: 5; margin-top: 22px">
            ${["생성", "맥락 추가", "대화로 탐색", "템플릿 정리", "기록 공유"].map((t, i) => `<article class="step"><span class="dot">${i + 1}</span><h3>${t}</h3><p>프로젝트 안에서 기준을 유지하고 결과를 재사용합니다.</p></article>`).join("")}
          </div>
        `);
      }

      function renderResearch(data) {
        return shell(data, `
          <div class="flow" style="--flow-count: 6">
            ${[
              ["질문 범위", "목적, 기간, 지역, 조건 정의"],
              ["공개 웹 검색", "신뢰 가능한 공개 출처 우선"],
              ["출처 비교", "여러 출처의 일치와 차이 확인"],
              ["근거 표", "주장, 출처, 날짜, 신뢰도 정리"],
              ["한계 표시", "불확실성, 가정, 추가 확인 분리"],
              ["최종 요약", "핵심 인사이트와 다음 액션 제공"],
            ].map(([t, b], i) => `<article class="step"><span class="dot ${i === 4 ? "purple" : ""}">${i + 1}</span><h3>${t}</h3><p>${b}</p></article>`).join("")}
          </div>
          <div class="grid cols-4" style="margin-top: 22px">
            <article class="card green"><h3>좋은 질문</h3><p>구체적이고 검증 가능한 범위로 좁힙니다.</p></article>
            <article class="card blue"><h3>출처 조건</h3><p>공식 문서, 기관 자료, 주요 언론을 우선합니다.</p></article>
            <article class="card"><h3>요약 구조</h3><p>TL;DR, 근거 표, 리스크, 추가 질문.</p></article>
            <article class="card purple"><h3>한계 확인</h3><p>상충 정보와 가정 조건을 분리합니다.</p></article>
          </div>
        `);
      }

      function renderEnterprise(data) {
        return shell(data, `
          <div class="split">
            <article class="card green">
              <h2>Enterprise의 의미</h2>
              <p>개인 생산성 도구가 아니라 회사 보안, 사용자 관리, 공유 지식, 업무 표준을 담는 워크스페이스입니다.</p>
              <div class="band"><strong>핵심</strong><p>회사 기준으로 접근하고, 검토하고, 공유합니다.</p></div>
            </article>
            <div class="grid cols-2">
              <article class="card"><h3>접근과 권한</h3><p>SSO, SCIM, 워크스페이스 정책을 따릅니다.</p></article>
              <article class="card blue"><h3>데이터 보호</h3><p>비즈니스 데이터 보호 원칙 위에서 사용합니다.</p></article>
              <article class="card purple"><h3>공유 지식</h3><p>프로젝트, GPT, 템플릿으로 팀 방식을 맞춥니다.</p></article>
              <article class="card"><h3>운영 가시성</h3><p>활용 현황을 보고 교육과 지원을 개선합니다.</p></article>
            </div>
          </div>
        `);
      }

      function renderMatrix(data) {
        return shell(data, `
          <div class="matrix">
            <div class="head">구분</div><div class="head">개인 구독</div><div class="head">Enterprise</div><div class="head">사용자 관점</div>
            ${[
              ["소유", "개인 계정과 개인 결제", "조직 워크스페이스와 회사 계정", "업무는 회사 제공 환경에서 시작"],
              ["데이터", "개인 설정 중심", "비즈니스 데이터 보호와 조직 정책", "민감정보는 필요한 만큼만 입력"],
              ["보안", "개인 로그인과 설정", "SSO, SCIM, 도메인 검증 가능", "접속과 기능은 회사 정책을 따름"],
              ["협업", "개인 작업물 중심", "프로젝트, GPT, 지식 자산 공유", "팀 템플릿으로 반복 업무 표준화"],
              ["기능", "개인 플랜 기준 한도", "계약과 워크스페이스 설정 기준", "기능 노출은 좌석과 설정을 확인"],
            ].map(([a, b, c, d]) => `<div><strong>${a}</strong></div><div><span>${b}</span></div><div><span>${c}</span></div><div><span>${d}</span></div>`).join("")}
          </div>
        `);
      }

      function renderOperating(data) {
        return shell(data, `
          <div class="grid cols-5">
            ${[
              ["스폰서", "목적과 성공 지표 승인"],
              ["IT/보안/법무", "접근, 정책, 데이터 기준 운영"],
              ["관리자", "구성원, 기능, 공유 자산 관리"],
              ["챔피언", "현업 사례와 템플릿 확산"],
              ["일반 사용자", "정책 준수와 업무 적용 피드백"],
            ].map(([t, b], i) => `<article class="card ${i === 4 ? "green" : ""}"><span class="dot">${i + 1}</span><h3>${t}</h3><p>${b}</p></article>`).join("")}
          </div>
          <div class="flow" style="--flow-count: 4; margin-top: 22px">
            ${["정책", "템플릿", "교육", "측정"].map((t, i) => `<article class="step"><span class="dot blue">${i + 1}</span><h3>${t}</h3><p>정해진 기준을 실제 사용 흐름에 반영하고 개선합니다.</p></article>`).join("")}
          </div>
        `);
      }

      function renderScenarios(data) {
        const rows = [
          ["개발", "에러 로그 원인 정리와 테스트 초안"],
          ["기획", "회의록 결정사항과 미결 이슈 구조화"],
          ["영업", "고객 미팅 후속 메일과 제안서 목차"],
          ["인사", "JD와 안내문 표현 개선"],
          ["법무/보안", "정책 초안의 모호한 문장 점검"],
          ["고객지원", "상담 유형 분류와 답변 초안"],
        ];
        return shell(data, `
          <div class="grid cols-3">
            ${rows.map(([t, b], i) => `<article class="card ${i % 3 === 1 ? "blue" : i % 3 === 2 ? "purple" : "green"}"><span class="kicker">${t}</span><h3>${b}</h3><p>입력 자료와 금지 데이터를 먼저 정하고, 사람이 검토하기 쉬운 출력 형식으로 요청합니다.</p></article>`).join("")}
          </div>
          <div class="band"><strong>시작 기준</strong><p>작게 맡기고, 결과를 검토하고, 잘 된 프롬프트를 팀 템플릿으로 남깁니다.</p></div>
        `);
      }

      function renderTimeline(data) {
        return shell(data, `
          <div class="timeline">
            ${[
              ["시작", "접속과 첫 업무", ["Enterprise 워크스페이스 접속", "개인 계정 사용 중단", "회의록 또는 메일 초안 실습"]],
              ["반복", "입력 구조 정착", ["목표/배경/발췌문/검토 기준", "첨부 없이 쓸 템플릿 저장", "결과 검토 기준 공유"]],
              ["공유", "팀 템플릿", ["반복 업무 3개 선정", "Projects 지시문 작성", "성공 사례와 실패 사례 정리"]],
              ["개선", "확산과 개선", ["사용자 피드백 수집", "정책 FAQ 보강", "다음 개선 과제 선정"]],
            ].map(([day, title, list], i) => `<article class="card ${i === 1 ? "blue" : i === 2 ? "purple" : "green"}"><span class="day">${day}</span><h3>${title}</h3><ul>${list.map((item) => `<li>${item}</li>`).join("")}</ul></article>`).join("")}
          </div>
        `);
      }

      function renderCodex(data) {
        return shell(data, `
          <div class="flow" style="--flow-count: 5">
            ${[
              ["목표 정의", "무엇을 고치고 언제 끝났다고 볼지 명시"],
              ["맥락 제공", "저장소, 파일, 에러, 재현 단계 설명"],
              ["작업 위임", "수정 범위와 금지할 변경을 구분"],
              ["검증 실행", "테스트, 빌드, 브라우저 확인 결과 확인"],
              ["공유", "커밋, PR, 배포 상태를 사람이 최종 확인"],
            ].map(([t, b], i) => `<article class="step"><span class="dot ${i === 3 ? "blue" : ""}">${i + 1}</span><h3>${t}</h3><p>${b}</p></article>`).join("")}
          </div>
          <div class="split" style="margin-top: 22px">
            <article class="card green"><h2>좋은 요청</h2><p>“이 저장소에서 로그인 오류를 재현하고, 실패 원인을 고친 뒤 node tests/static-check.mjs와 브라우저 캡처로 확인해줘.”</p></article>
            <article class="card blue"><h2>사용자 확인</h2><p>AI가 만든 변경이라도 비즈니스 요구, 보안 표현, 배포 영향은 사람이 최종 승인합니다.</p></article>
          </div>
        `);
      }

      const renderers = {
        overview: renderOverview,
        chat: renderChat,
        image: renderImage,
        projects: renderProjects,
        research: renderResearch,
        enterprise: renderEnterprise,
        matrix: renderMatrix,
        operating: renderOperating,
        scenarios: renderScenarios,
        timeline: renderTimeline,
        codex: renderCodex,
      };

      const params = new URLSearchParams(location.search);
      const assetName = params.get("asset") || "guide-overview-white";
      const data = assets[assetName] || assets["guide-overview-white"];
      document.getElementById("board").innerHTML = renderers[data.kind](data);
    </script>
  </body>
</html>
